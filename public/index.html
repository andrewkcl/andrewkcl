<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>andrewkcl · Task Tracker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Task Tracker</h1>
        <p class="app__subtitle">A tiny full-stack demo running in a Cloud Agent environment.</p>
      </header>

      <form id="new-task-form" class="task-form" autocomplete="off">
        <input
          id="new-task-input"
          class="task-form__input"
          type="text"
          name="title"
          placeholder="Add a new task…"
          aria-label="New task title"
          required
        />
        <button class="task-form__button" type="submit">Add</button>
      </form>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state" hidden>No tasks yet — add one above.</p>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
